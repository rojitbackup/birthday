<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Happy Birthday MYCHA 💗</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg1: #ffe3ec;
        --bg2: #ffc2d6;
        --ink: #8a1f4b;
        --pink: #ff6b9d;
        --dk: #d93d78;
        color-scheme: light;
      }
      html {
        height: 100%;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Quicksand", system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(
          circle at 20% 15%,
          var(--bg1),
          var(--bg2) 80%
        );
      }
      .float {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .float span {
        position: absolute;
        bottom: -60px;
        animation: rise linear infinite;
        pointer-events: auto;
        cursor: pointer;
      }
      .float span.pop {
        animation: pop 0.4s forwards;
      }
      @keyframes rise {
        to {
          transform: translateY(-115vh) rotate(25deg);
        }
      }
      @keyframes pop {
        to {
          transform: scale(2.2);
          opacity: 0;
        }
      }
      .screen {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 20px 24px;
        pointer-events: none;
      }
      .screen > * {
        pointer-events: auto;
      }
      #home {
        display: flex;
      }
      h1 {
        font-family: "Pacifico", cursive, serif;
        font-weight: 400;
        font-size: clamp(2.4rem, 10vw, 5rem);
        line-height: 1.15;
        margin: 0.2em 0;
        text-shadow:
          0 3px 0 #fff,
          0 0 24px #fff8;
      }
      .name {
        display: block;
        color: var(--pink);
        cursor: pointer;
      }
      .sub {
        font-size: 1.05rem;
        margin: 0 0 1.2rem;
        max-width: 30ch;
      }
      button {
        font:
          700 1.05rem "Quicksand",
          system-ui,
          sans-serif;
        border: 0;
        border-radius: 999px;
        padding: 0.85em 1.7em;
        color: #fff;
        background: var(--pink);
        box-shadow: 0 6px 0 var(--dk);
        cursor: pointer;
        margin: 0.3rem;
      }
      button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--dk);
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
      .pulse {
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.06);
        }
      }
      .hide {
        display: none !important;
      }
      .cake {
        width: 150px;
        cursor: pointer;
      }
      .bob {
        animation: bob 2.4s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-8px);
        }
      }
      .flame {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: flick 0.5s ease-in-out infinite alternate;
      }
      @keyframes flick {
        to {
          transform: scale(1.15, 0.9) rotate(4deg);
        }
      }
      .blowing .flame {
        animation: wig 1s ease-in-out forwards;
      }
      @keyframes wig {
        0% {
          transform: rotate(0);
        }
        18% {
          transform: rotate(-24deg) scaleY(0.9);
        }
        40% {
          transform: rotate(20deg) scaleY(0.75);
        }
        62% {
          transform: rotate(-28deg) scaleY(0.6);
        }
        82% {
          transform: rotate(16deg) scaleY(0.45);
        }
        100% {
          transform: rotate(-8deg) scaleY(0.25);
        }
      }
      .puff {
        opacity: 0;
      }
      .blowing .puff {
        animation: puff 1s ease-out;
      }
      @keyframes puff {
        0% {
          opacity: 0;
          transform: translateX(-14px);
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(30px);
        }
      }
      .hint {
        fill: none;
        stroke: #ff6b9d;
        stroke-width: 2;
        transform-box: fill-box;
        transform-origin: center;
        animation: hint 1.4s ease-out infinite;
      }
      @keyframes hint {
        from {
          transform: scale(0.6);
          opacity: 1;
        }
        to {
          transform: scale(1.7);
          opacity: 0;
        }
      }
      .blowing .hint,
      .out .hint {
        display: none;
      }
      .smoke {
        opacity: 0;
      }
      .out .smoke {
        animation: smoke 3s ease-out infinite;
      }
      .out .flame {
        display: none;
      }
      @keyframes smoke {
        0% {
          opacity: 0.7;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-26px);
        }
      }
      .note {
        background: #fff;
        border-radius: 18px;
        padding: 12px 16px;
        max-width: 30ch;
        margin: 0.4rem 0;
        box-shadow: 0 4px 14px #d93d7833;
      }
      /* curtains */
      #curtain {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        pointer-events: none;
      }
      #curtain i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: repeating-linear-gradient(
          90deg,
          #c2185b,
          #e91e63 22px,
          #c2185b 44px
        );
        transition: transform 1.6s ease;
      }
      #curtain i:first-child {
        left: 0;
      }
      #curtain i:last-child {
        right: 0;
      }
      #curtain.open i:first-child {
        transform: translateX(-100%);
      }
      #curtain.open i:last-child {
        transform: translateX(100%);
      }
      #count {
        position: fixed;
        inset: 0;
        z-index: 21;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #fff;
        font-family: "Pacifico", cursive;
        text-align: center;
        text-shadow: 0 3px 8px #0006;
        pointer-events: none;
      }
      #count b {
        font-size: 7rem;
        font-weight: 400;
      }
      #count span {
        font-size: 1.6rem;
      }
      /* credits */
      #credits {
        overflow: hidden;
        pointer-events: auto;
      }
      .roll {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        text-align: center;
        padding: 0 24px;
        will-change: transform;
      }
      .roll p {
        margin: 0 0 1.6rem;
        font-size: clamp(1.1rem, 4.4vw, 1.5rem);
        font-weight: 700;
        line-height: 1.5;
      }
      .roll .t {
        font-family: "Pacifico", cursive, serif;
        font-weight: 400;
        font-size: clamp(1.8rem, 8vw, 3rem);
        color: var(--pink);
        text-shadow: 0 2px 0 #fff;
      }
      .roll .role {
        font-size: clamp(0.95rem, 3.6vw, 1.15rem);
      }
      .roll .role b {
        display: block;
        font-size: 1.2em;
        color: var(--pink);
      }
      .gap {
        height: 16vh;
      }
      .roll .wish {
        font-style: italic;
        background: #ffffffaa;
        border-radius: 20px;
        padding: 18px 16px;
        max-width: 34ch;
        margin: 0 auto 1.6rem;
      }
      .pol {
        background: #fff;
        width: min(70vw, 260px);
        margin: 0 auto 2rem;
        padding: 10px 10px 6px;
        box-shadow: 0 6px 18px #8a1f4b33;
        transform: rotate(var(--r, -3deg));
      }
      .pol .ph {
        aspect-ratio: 1;
        background: #ffd6e5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        overflow: hidden;
      }
      .pol img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pol small {
        display: block;
        font-family: "Pacifico", cursive;
        font-size: 1rem;
        padding: 6px 0;
      }
      #ptip {
        position: fixed;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.8rem;
        opacity: 0.7;
        z-index: 5;
        display: none;
      }
      /* finale */
      #fin1,
      #fin2,
      #fin3 {
        background: #ffe3eee6;
        z-index: 6;
        pointer-events: auto;
      }
      .gift {
        width: 150px;
        cursor: pointer;
      }
      .lid {
        transition: transform 0.7s;
        transform-origin: 50% 100%;
      }
      .gift.open .lid {
        transform: translateY(-34px) rotate(-14deg);
      }
      .card {
        background: #fff;
        border-radius: 22px;
        padding: 28px 22px;
        width: min(88vw, 340px);
        min-height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.5;
        box-shadow: 0 8px 24px #d93d7844;
        margin-bottom: 0.8rem;
      }
      .coupons {
        display: grid;
        gap: 10px;
        width: min(90vw, 360px);
        max-height: 62vh;
        overflow: auto;
        margin-bottom: 0.6rem;
      }
      .cp {
        background: #fff;
        border: 2px dashed var(--pink);
        border-radius: 16px;
        padding: 12px 14px;
        font-weight: 700;
        text-align: left;
      }
      .cp small {
        display: block;
        font-weight: 500;
        opacity: 0.8;
      }
      .conf {
        position: fixed;
        top: -30px;
        pointer-events: none;
        z-index: 30;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(540deg);
        }
      }
      #mute {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: 10px;
        z-index: 25;
        padding: 0.4em 0.7em;
        box-shadow: none;
        display: none;
      }
      #skip {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        right: 10px;
        z-index: 25;
        padding: 0.4em 0.9em;
        box-shadow: none;
        display: none;
        font-size: 0.85rem;
      }
      html,
      body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 40;
      }
      @media (prefers-reduced-motion: reduce) {
        .float span,
        .bob,
        .pulse,
        .flame {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="float" id="float"></div>
    <canvas id="fx"></canvas>
    <button id="mute" aria-label="Mute music">🔊</button
    ><button id="skip">Skip</button>
    <audio id="audio" loop></audio>

    <!-- HOME -->
    <div class="screen" id="home">
      <svg
        class="cake bob"
        id="cake"
        viewBox="0 0 150 130"
        role="button"
        aria-label="Blow out the candle"
      >
        <ellipse cx="75" cy="122" rx="62" ry="7" fill="#d93d7833" />
        <rect x="20" y="70" width="110" height="48" rx="12" fill="#ffb3cc" />
        <rect x="30" y="46" width="90" height="34" rx="10" fill="#fff" />
        <path
          d="M20 82q10 14 20 0t20 0 20 0 20 0 20 0 10 0"
          fill="none"
          stroke="#fff"
          stroke-width="9"
          stroke-linecap="round"
        />
        <circle cx="48" cy="100" r="4" fill="#ff6b9d" />
        <circle cx="75" cy="104" r="4" fill="#ffb703" />
        <circle cx="102" cy="100" r="4" fill="#ff6b9d" />
        <rect x="71" y="26" width="8" height="22" rx="3" fill="#ff6b9d" />
        <circle class="hint" cx="75" cy="16" r="16" />
        <text class="puff" x="8" y="24" font-size="18">💨</text>
        <g class="flame">
          <path d="M75 8c8 8 7 14 0 16-7-2-8-8 0-16z" fill="#ffb703" />
          <path d="M75 14c4 4 3 7 0 8-3-1-4-4 0-8z" fill="#fff3b0" />
        </g>
        <path
          class="smoke"
          d="M75 22q-6-6 0-12t0-8"
          fill="none"
          stroke="#999"
          stroke-width="3"
          stroke-linecap="round"
        />
        <circle cx="62" cy="62" r="2.5" fill="#8a1f4b" />
        <circle cx="88" cy="62" r="2.5" fill="#8a1f4b" />
        <path
          d="M70 66q5 5 10 0"
          fill="none"
          stroke="#8a1f4b"
          stroke-width="2"
          stroke-linecap="round"
        />
        <circle cx="55" cy="67" r="4" fill="#ff9ab8" opacity=".7" />
        <circle cx="95" cy="67" r="4" fill="#ff9ab8" opacity=".7" />
      </svg>
      <h1>Happy Birthday<span class="name" id="herName"></span></h1>
      <p class="sub" id="homeSub"></p>
      <button id="open" class="pulse hide"></button>
      <div class="note hide" id="secret"></div>
      <p class="sub hide" id="madeBy"></p>
    </div>

    <!-- CURTAIN + COUNTDOWN -->
    <div id="curtain"><i></i><i></i></div>
    <div id="count"><span>Now showing…</span><b id="num">3</b></div>

    <!-- CREDITS -->
    <div class="screen" id="credits"><div class="roll" id="roll"></div></div>
    <div id="ptip">tap to pause / play</div>

    <!-- FINALE -->
    <div class="screen" id="fin1">
      <svg class="cake bob" viewBox="0 0 100 90" style="cursor: default">
        <path
          d="M50 84C10 56 4 30 22 16c12-9 24-2 28 8 4-10 16-17 28-8 18 14 12 40-28 68z"
          fill="#ff6b9d"
        />
      </svg>
      <h1 id="finalLine"></h1>
      <p class="sub" id="finalSub"></p>
      <button id="toGift" class="pulse">Open my gift 🎁</button>
      <button
        id="toHome2"
        style="background: #fff; color: var(--ink); box-shadow: 0 6px 0 #f3b1c8"
      >
        Go home 🏠
      </button>
    </div>
    <div class="screen" id="fin2">
      <p class="sub">One more thing…</p>
      <svg
        class="gift bob"
        id="gift"
        viewBox="0 0 150 140"
        role="button"
        aria-label="Open the gift"
      >
        <rect x="20" y="62" width="110" height="68" rx="8" fill="#ff8fb5" />
        <rect x="67" y="62" width="16" height="68" fill="#fff" />
        <g class="lid">
          <rect x="12" y="40" width="126" height="26" rx="8" fill="#ff6b9d" />
          <rect x="67" y="40" width="16" height="26" fill="#fff" />
          <path
            d="M75 40c-22-26-40-6-20 0zM75 40c22-26 40-6 20 0z"
            fill="#fff"
          />
        </g>
      </svg>
      <p class="sub">Tap the gift 🎁</p>
    </div>
    <div class="screen" id="fin3">
      <div class="card" id="card"></div>
      <div class="coupons hide" id="coupons"></div>
      <button id="next">Next 💗</button>
    </div>

    <script>
      /* =================== EDIT EVERYTHING HERE =================== */
      var HER_NAME = "Pranisha";
      var NICK = "MYCHA"; // shown in credits & finale
      var MY_NAME = "Rojit";

      var MUSIC_SRC = "song.mp3"; // PLACEHOLDER: song file, e.g. "song.mp3" (leave "" for no music)

      var PHOTOS = [
        // PLACEHOLDER: set src to your photo file, e.g. "photos/1.jpg"
        { src: "samaya.jpeg", cap: "One Memorable date" },
        { src: "us.jpeg", cap: "My favorite day" },
        { src: "trek.jpeg", cap: "You being you" },
        { src: "newyear.jpeg", cap: "Us 💗" },
      ];

      var WISH =
        "Happy Birthday, " +
        NICK +
        "To my baby, You have always been my best person in this whole world. No matter what happens, I will never leave your side. This is one birthday, we still have a lot more to go. I wish you the happiest birthday, filled with joy and happiness only babyyyy. I loveee you and have the besttt year aheadd MYCHAAAA. — " +
        MY_NAME; // EDIT: your birthday wish

      var CREDITS = [
        // types: t=title, p=line, role=[label,value], photo=index, gap
        ["t", "A Love Story"],
        ["p", "Starring"],
        ["t", HER_NAME + " & " + MY_NAME],
        ["gap"],
        ["wish", WISH],
        ["gap"],
        ["p", "Hey " + NICK + ", this one is just for you…"],
        ["photo", 0],
        ["role", "Most Beautiful Smile", "MY Baby's"],
        ["role", "Best Hug Provider", "You"],
        ["photo", 1],
        ["role", "Keeper of My Heart", "MYCHA"],
        ["p", "HOLD MY HAND THROUGH EVERYTHING, FOREVER."],
        ["photo", 2],
        ["p", "You are my favorite everything."],
        ["photo", 3],
        ["role", "Directed by", "Me, forever your biggest fan"],
        ["role", "Produced with", "Lots and lots of love"],
        ["gap"],
        ["t", "Happy Birthday, " + NICK + "!"],
        ["gap"],
      ];

      var FINAL = "I love you, " + NICK;
      var FINAL_SUB = "Happy Birthday. Here's to every year with you.";

      var REASONS = [
        // PLACEHOLDER: cards she taps through
        "Reason 1: YOU MAKE ME BETTERRRRRRR",
        "Reason 2: YOU WERE ALWAYS THERE FOR ME",
        "Reason 3: BECAUSE YOU ARE MY FAVORITE MANCHEEEEE",
        "Reason 4: BECAUSE YOU ARE THE BEST GIRLFRIEND IN THE WHOLE WORLD",
        "Reason 5: BECAUSE I DO NOT NEED A REASON TO LOVE YOUUUUUU",
      ];

      var COUPONS = [
        // PLACEHOLDER: gifts she can redeem
        ["One Cafe date", "Your choice of place hehhehehe"],
        ["Unlimited Kissesss", "Anytime, anywhere heheheh"],
        ["One big hug, anytime", "Valid forever Babyyyyyy."],
      ];

      var SECRET =
        "HEHEHE YOU FOUND ITTTT. I LOVE YOU FOREVER BABYYYYYYY. I WILL BE THERE FOR YOU, HIDING LIKE THIS MESSAGE. EVEN WHEN YOU DO NOT SEE ME AROUND, I WILL ALWAYS ALWAYS BE WITH MY BABBYYYYYYYY. HELPING THROUGH EVERYTHING HEHEEH <3";
      /* ============================================================ */

      var $ = function (i) {
        return document.getElementById(i);
      };
      var show = function (id, d) {
        $(id).style.display = d || "flex";
      };
      var hideEl = function (id) {
        $(id).style.display = "none";
      };
      var blown = false,
        seen = false,
        anim = null,
        audio = $("audio");

      $("herName").textContent = HER_NAME;
      $("homeSub").textContent =
        "Close your eyes and make a wish ✨ Then tap the candle to blow it out 🕯️";
      $("secret").textContent = SECRET;
      $("madeBy").textContent = "Made with love by " + MY_NAME + " 💗";
      $("finalLine").textContent = FINAL;
      $("finalSub").textContent = FINAL_SUB;

      /* floating emojis you can pop */
      var em = ["💗", "🌸", "✨", "💖", "🎀", "🎈", "🌷", "⭐", "🧸", "🍰"],
        fl = $("float");
      for (var i = 0; i < 22; i++) {
        var s = document.createElement("span");
        s.textContent = em[i % em.length];
        s.style.left = Math.random() * 100 + "%";
        s.style.fontSize = 20 + Math.random() * 26 + "px";
        s.style.animationDuration = 9 + Math.random() * 10 + "s";
        s.style.animationDelay = -Math.random() * 14 + "s";
        s.onclick = function () {
          this.classList.add("pop");
        };
        fl.appendChild(s);
      }

      function confetti() {
        var cs = [
          "#ff6b9d",
          "#ffb703",
          "#fff",
          "#ff9ab8",
          "#c77dff",
          "#8ecae6",
        ];
        for (var i = 0; i < 90; i++) {
          var d = document.createElement("div");
          d.className = "conf";
          d.style.left = Math.random() * 100 + "vw";
          var w = 6 + Math.random() * 8;
          d.style.cssText +=
            "width:" +
            w +
            "px;height:" +
            w * 1.6 +
            "px;background:" +
            cs[i % 6] +
            ";border-radius:2px;animation-duration:" +
            (2.5 + Math.random() * 2.5) +
            "s;animation-delay:" +
            Math.random() * 1.5 +
            "s";
          document.body.appendChild(d);
          setTimeout(
            function (x) {
              x.remove();
            },
            7000,
            d,
          );
        }
      }

      /* ---- home ---- */
      function setHome() {
        ["credits", "fin1", "fin2", "fin3"].forEach(hideEl);
        ["skip", "mute"].forEach(hideEl);
        $("ptip").style.display = "none";
        show("home");
        if (blown) {
          $("cake").classList.add("out");
          $("homeSub").textContent = "Your message is waiting 💌";
          $("homeSub").style.display = seen ? "none" : "";
          $("open").textContent = "Watch again 💌";
          $("open").classList.remove("hide");
          $("madeBy").classList.remove("hide");
        } else $("open").textContent = "Open my message 💌";
      }
      $("cake").onclick = function () {
        if (blown) return;
        blown = true;
        var k = this;
        k.classList.add("blowing");
        $("homeSub").textContent = "Make your wish… 💫";
        setTimeout(function () {
          k.classList.remove("blowing");
          k.classList.add("out");
          confetti();
          $("homeSub").textContent = "Wish made! 🎉 Now open your message.";
          $("open").classList.remove("hide");
          $("madeBy").classList.remove("hide");
        }, 1100);
      };
      $("herName").onclick = function () {
        $("secret").classList.toggle("hide");
      };

      /* ---- start: music, curtain, countdown ---- */
      $("open").onclick = function () {
        if (MUSIC_SRC) {
          audio.src = MUSIC_SRC;
          audio.play().catch(function () {});
          $("mute").style.display = "block";
        }
        seen = true;
        hideEl("home");
        buildCredits();
        show("credits", "block");
        var c = $("curtain");
        c.classList.remove("open");
        c.style.display = "block";
        show("count");
        var n = 3;
        $("num").textContent = n;
        var t = setInterval(function () {
          n--;
          if (n > 0) {
            $("num").textContent = n;
            return;
          }
          clearInterval(t);
          hideEl("count");
          c.classList.add("open");
          $("skip").style.display = "block";
          $("ptip").style.display = "block";
          startRoll();
          setTimeout(function () {
            c.style.display = "none";
          }, 1700);
        }, 1000);
      };
      $("mute").onclick = function () {
        audio.muted = !audio.muted;
        this.textContent = audio.muted ? "🔇" : "🔊";
      };

      /* ---- credits ---- */
      function buildCredits() {
        if (anim) {
          anim.cancel();
          anim = null;
        }
        $("roll").innerHTML = CREDITS.map(function (c) {
          if (c[0] == "t") return '<p class="t">' + c[1] + "</p>";
          if (c[0] == "wish") return '<p class="wish">' + c[1] + "</p>";
          if (c[0] == "gap") return '<div class="gap"></div>';
          if (c[0] == "role")
            return '<p class="role">' + c[1] + "<b>" + c[2] + "</b></p>";
          if (c[0] == "photo") {
            var p = PHOTOS[c[1]] || { src: "", cap: "" },
              r = c[1] % 2 ? 3 : -3;
            return (
              '<div class="pol" style="--r:' +
              r +
              'deg"><div class="ph">' +
              (p.src
                ? '<img src="' + p.src + '" alt="">'
                : "📷 Photo " + (c[1] + 1) + " goes here") +
              "</div><small>" +
              p.cap +
              "</small></div>"
            );
          }
          return "<p>" + c[1] + "</p>";
        }).join("");
        $("roll").style.transform = "translateY(" + innerHeight + "px)";
      }
      function startRoll() {
        var h = innerHeight,
          tot = $("roll").scrollHeight;
        if (anim) anim.cancel();
        anim = $("roll").animate(
          [
            { transform: "translateY(" + h + "px)" },
            { transform: "translateY(-" + tot + "px)" },
          ],
          {
            duration: ((h + tot) / 55) * 1000,
            easing: "linear",
            fill: "forwards",
          },
        );
        anim.onfinish = finale;
      }
      $("credits").onclick = function () {
        if (!anim) return;
        anim.playState == "running" ? anim.pause() : anim.play();
      };
      $("skip").onclick = function () {
        if (anim) anim.cancel();
        finale();
      };

      /* ---- finale: heart -> gift -> cards -> coupons -> home ---- */
      var ri = 0;
      function finale() {
        hideEl("credits");
        hideEl("skip");
        $("ptip").style.display = "none";
        show("fin1");
        confetti();
      }
      $("toGift").onclick = function () {
        hideEl("fin1");
        $("gift").classList.remove("open");
        show("fin2");
      };
      $("toHome2").onclick = function () {
        hideEl("fin1");
        setHome();
      };
      $("gift").onclick = function () {
        this.classList.add("open");
        confetti();
        setTimeout(function () {
          hideEl("fin2");
          ri = 0;
          $("coupons").classList.add("hide");
          $("card").classList.remove("hide");
          $("next").textContent = "Next 💗";
          showReason();
          show("fin3");
        }, 900);
      };
      function showReason() {
        $("card").textContent = REASONS[ri];
      }
      $("next").onclick = function () {
        if ($("next").dataset.home) {
          delete $("next").dataset.home;
          return goHome();
        }
        ri++;
        if (ri < REASONS.length) {
          showReason();
          if (ri == REASONS.length - 1)
            $("next").textContent = "Open my coupons 🎟️";
          return;
        }
        $("card").classList.add("hide");
        $("coupons").innerHTML = COUPONS.map(function (c) {
          return (
            '<div class="cp">🎟️ ' + c[0] + "<small>" + c[1] + "</small></div>"
          );
        }).join("");
        $("coupons").classList.remove("hide");
        confetti();
        $("next").textContent = "Back to home 🏠";
        $("next").dataset.home = "1";
      };
      function goHome() {
        hideEl("fin3");
        setHome();
      }
      /* ---- glow + sparkles around cursor / held finger, pushes the floating emojis ---- */
      (function () {
        var cv = $("fx"),
          cx = cv.getContext("2d"),
          dpr = Math.min(devicePixelRatio || 1, 2);
        function size() {
          cv.width = innerWidth * dpr;
          cv.height = innerHeight * dpr;
          cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        size();
        addEventListener("resize", size);
        if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
        var P = {
            x: -999,
            y: -999,
            lx: -999,
            ly: -999,
            on: false,
            held: false,
          },
          g = 0,
          f = 0,
          stars = [],
          R = 120,
          cols = ["#ffffff", "#fff3b0", "#ffb703", "#ff6b9d", "#ffd6e5"];
        function pos(e) {
          P.x = e.clientX;
          P.y = e.clientY;
        }
        addEventListener("pointerdown", function (e) {
          pos(e);
          P.held = true;
          P.on = true;
          P.lx = P.x;
          P.ly = P.y;
        });
        addEventListener("pointermove", function (e) {
          pos(e);
          if (e.pointerType == "mouse") P.on = true;
          else P.on = P.held;
        });
        function up(e) {
          P.held = false;
          if (e.pointerType != "mouse") P.on = false;
        }
        addEventListener("pointerup", up);
        addEventListener("pointercancel", up);
        document.addEventListener("mouseleave", function () {
          P.on = false;
        });
        function spark(x, y) {
          if (stars.length > 140) return;
          stars.push({
            x: x + (Math.random() - 0.5) * 16,
            y: y + (Math.random() - 0.5) * 16,
            vx: (Math.random() - 0.5) * 1.2,
            vy: Math.random() * -1 - 0.2,
            l: 1,
            d: 0.014 + Math.random() * 0.02,
            r: 3 + Math.random() * 7,
            c: cols[(Math.random() * cols.length) | 0],
            a: Math.random() * 6,
          });
        }
        function star(x, y, r, a) {
          cx.beginPath();
          for (var i = 0; i < 8; i++) {
            var t = a + (i * Math.PI) / 4,
              q = i % 2 ? r * 0.28 : r;
            cx.lineTo(x + Math.cos(t) * q, y + Math.sin(t) * q);
          }
          cx.closePath();
          cx.fill();
        }
        function frame() {
          f++;
          cx.clearRect(0, 0, innerWidth, innerHeight);
          var moved = Math.hypot(P.x - P.lx, P.y - P.ly);
          P.lx = P.x;
          P.ly = P.y;
          if (P.on) {
            var n = Math.min(3, (moved / 10) | 0);
            if (P.held && f % 2 == 0) n = Math.max(n, 1);
            if (!n && f % 8 == 0) n = 1;
            for (var i = 0; i < n; i++) spark(P.x, P.y);
          }
          g += ((P.on ? 1 : 0) - g) * 0.12;
          if (g > 0.02) {
            var gr = cx.createRadialGradient(P.x, P.y, 0, P.x, P.y, 90);
            gr.addColorStop(0, "rgba(255,255,255," + 0.75 * g + ")");
            gr.addColorStop(0.35, "rgba(255,214,229," + 0.4 * g + ")");
            gr.addColorStop(1, "rgba(255,214,229,0)");
            cx.fillStyle = gr;
            cx.beginPath();
            cx.arc(P.x, P.y, 90, 0, 7);
            cx.fill();
          }
          for (var j = stars.length - 1; j >= 0; j--) {
            var s = stars[j];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.01;
            s.l -= s.d;
            s.a += 0.05;
            if (s.l <= 0) {
              stars.splice(j, 1);
              continue;
            }
            cx.globalAlpha =
              Math.min(1, s.l * 1.6) * (0.65 + 0.35 * Math.sin(s.a * 4));
            cx.fillStyle = s.c;
            cx.shadowColor = s.c;
            cx.shadowBlur = 8;
            star(s.x, s.y, s.r * (0.5 + s.l * 0.5), s.a);
          }
          cx.globalAlpha = 1;
          cx.shadowBlur = 0;
          /* push the floating emojis away, curving around the pointer */
          var els = fl.children;
          for (var k = 0; k < els.length; k++) {
            var el = els[k],
              o = el._o || (el._o = [0, 0]),
              b = el.getBoundingClientRect(),
              nx = b.left + b.width / 2 - o[0],
              ny = b.top + b.height / 2 - o[1],
              tx = 0,
              ty = 0;
            if (P.on) {
              var dx = nx - P.x,
                dy = ny - P.y,
                d = Math.hypot(dx, dy) || 1;
              if (d < R) {
                var m = Math.pow(1 - d / R, 2) * 120,
                  ux = dx / d,
                  uy = dy / d;
                tx = ux * m - uy * m * 0.45;
                ty = uy * m + ux * m * 0.45;
              }
            }
            o[0] += (tx - o[0]) * 0.14;
            o[1] += (ty - o[1]) * 0.14;
            el.style.translate =
              o[0].toFixed(1) + "px " + o[1].toFixed(1) + "px";
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
      setHome();
    </script>
  </body>
</html>
